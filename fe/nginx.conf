# =============================================================================
# LMS Maritime Frontend - nginx Configuration
# Architecture: nginx serves static files + proxies page requests to Node.js SSR
# Features: SSR proxy, API proxy, PWA headers, security headers, gzip, caching
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /app/browser;
    index index.csr.html index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript
               application/x-javascript application/xml
               application/javascript application/json;

    # Security Headers (Caddy adds these at the edge for HTTPS; nginx adds for direct access)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: http://localhost:8088 http://127.0.0.1:8088; connect-src 'self' https://wiii.holilihu.online https://sandbox.vnpayment.vn https://pay.vnpay.vn https://qr.sepay.vn wss:; font-src 'self' data:; frame-src https://wiii.holilihu.online; object-src 'none'; base-uri 'self';" always;

    # PWA Service Worker - must always be fresh
    # NOTE: add_header in child blocks overrides parent — re-add security headers
    location = /ngsw-worker.js {
        if ($host = localhost) {
            return 404;
        }
        if ($host = 127.0.0.1) {
            return 404;
        }
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri =404;
    }

    location = /ngsw.json {
        if ($host = localhost) {
            return 404;
        }
        if ($host = 127.0.0.1) {
            return 404;
        }
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri =404;
    }

    # PWA Reset - returns a standalone HTML page that clears all SW + caches
    # Bypasses Service Worker completely (no try_files fallback to Angular)
    # Usage: holilihu.online/reset-sw (works even when SW is completely broken)
    location = /reset-sw {
        default_type text/html;
        return 200 '<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PWA Reset</title></head><body style="font-family:system-ui;text-align:center;padding:40px"><h2>Resetting PWA...</h2><p id="s">Clearing Service Worker and caches...</p><script>!function(){var s=document.getElementById("s");if(!("serviceWorker"in navigator)){s.textContent="No Service Worker found.";return}Promise.all([navigator.serviceWorker.getRegistrations().then(function(r){return Promise.all(r.map(function(e){return e.unregister()}))}),caches.keys().then(function(n){return Promise.all(n.map(function(c){return caches.delete(c)}))})]).then(function(){s.textContent="Done! Redirecting...";setTimeout(function(){location.href="/"},1500)}).catch(function(e){s.textContent="Error: "+e.message+". Try clearing browser data manually."})}()</script></body></html>';
    }

    # Static Assets — serve directly from nginx (fast, cached, hashed filenames = immutable)
    # NOTE: add_header in child blocks overrides parent — re-add security headers
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif|map|webmanifest)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        access_log off;
        try_files $uri =404;
    }

    # Known static files — serve directly (robots.txt, sitemap.xml, sw files)
    location ~* ^/(robots\.txt|sitemap\.xml|sw-wrapper\.js|safety-worker\.js|index\.csr\.html)$ {
        try_files $uri =404;
    }

    # API Proxy to Backend Service
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE support (AI streaming)
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;

        # Timeouts for long-running requests
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;

        # File upload size
        client_max_body_size 60m;
    }

    # Uploads Proxy (LocalStorageService files)
    location /uploads/ {
        proxy_pass http://backend:8080/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Actuator Health Check Proxy (restrict to /health only)
    location = /actuator/health {
        proxy_pass http://backend:8080/actuator/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Swagger UI Proxy (Caddy handles in prod, nginx proxy for dev/compose)
    location /swagger-ui {
        proxy_pass http://backend:8080/swagger-ui;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /v3/api-docs {
        proxy_pass http://backend:8080/v3/api-docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # SSR: Proxy page requests to Node.js (Angular SSR on port 4000)
    # If Node.js is down, fall back to CSR (index.csr.html)
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Graceful SSR fallback: if Node.js crashes, serve CSR shell
        proxy_intercept_errors on;
        error_page 502 503 504 = /index.csr.html;
    }

    # Health check endpoint
    location /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }
}
