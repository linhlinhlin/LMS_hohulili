# =============================================================================
# LMS Maritime Frontend - nginx Configuration
# Architecture: nginx serves static files + proxies page requests to Node.js SSR
# Features: SSR proxy, API proxy, PWA headers, security headers, gzip, caching
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /app/browser;
    index index.csr.html index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript
               application/x-javascript application/xml
               application/javascript application/json;

    # Security Headers (Caddy adds these at the edge for HTTPS; nginx adds for direct access)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: http://localhost:8088 http://127.0.0.1:8088; connect-src 'self' http://localhost:8088 http://127.0.0.1:8088 http://localhost:8000 http://127.0.0.1:8000 https://wiii.holilihu.online https://sandbox.vnpayment.vn https://pay.vnpay.vn https://qr.sepay.vn https://videodelivery.net wss:; media-src 'self' data: blob: https: http://localhost:8088 http://127.0.0.1:8088; font-src 'self' data:; frame-src 'self' https: http://localhost:8088 http://127.0.0.1:8088 http://localhost:8000 http://127.0.0.1:8000 blob:; object-src 'none'; base-uri 'self';" always;

    # PWA Service Worker - must always be fresh
    # NOTE: add_header in child blocks overrides parent — re-add security headers
    location = /ngsw-worker.js {
        if ($host = localhost) {
            return 404;
        }
        if ($host = 127.0.0.1) {
            return 404;
        }
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri =404;
    }

    location = /ngsw.json {
        if ($host = localhost) {
            return 404;
        }
        if ($host = 127.0.0.1) {
            return 404;
        }
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri =404;
    }

    # PWA hard reset - standalone page that bypasses Angular and stale SW state.
    # Usage: /reset-sw?returnUrl=%2Fstudent%2Fstorage
    location = /reset-sw {
        default_type text/html;
        return 200 '<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Khôi phục PWA</title></head><body style="font-family:system-ui,Segoe UI,sans-serif;max-width:680px;margin:0 auto;padding:32px;line-height:1.55;color:#0f172a"><h2 style="margin:0 0 12px">Đang khôi phục PWA...</h2><p id="s" style="margin:0 0 16px;color:#475569">Đang gỡ service worker, xóa cache và dọn bộ nhớ ngoại tuyến cũ.</p><p style="margin:0;color:#64748b;font-size:14px">Nếu trình duyệt vẫn không mở lại bộ nhớ ngoại tuyến sau bước này, hãy xóa toàn bộ site data của <strong>holilihu.online</strong> rồi đăng nhập lại.</p><script>(async()=>{const status=document.getElementById("s");const params=new URLSearchParams(location.search);const returnUrl=params.get("returnUrl")||"/student/storage";try{if("serviceWorker" in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(reg=>reg.unregister().catch(()=>false)));}if("caches" in window){const names=await caches.keys();await Promise.all(names.map(name=>caches.delete(name).catch(()=>false)));}if(window.indexedDB&&indexedDB.databases){const dbs=await indexedDB.databases();for(const db of dbs){if(db&&db.name&&db.name.indexOf("lms-maritime-offline")===0){await new Promise(resolve=>{const req=indexedDB.deleteDatabase(db.name);req.onsuccess=()=>resolve();req.onerror=()=>resolve();req.onblocked=()=>resolve();});}}}try{localStorage.removeItem("pwa-ready-shown");localStorage.removeItem("lms_offline_active_db_name");localStorage.removeItem("lms_offline_known_db_names");localStorage.removeItem("lms_offline_storage_health");localStorage.removeItem("lms_offline_storage_telemetry");localStorage.removeItem("lms_offline_storage_sent_event_ids");}catch(_){ }status.textContent="Đã dọn service worker, cache và kho ngoại tuyến cục bộ. Đang quay lại ứng dụng...";setTimeout(()=>{location.href=returnUrl;},1600);}catch(error){console.error("[PWA] Hard reset failed.",error);status.textContent="Không thể khôi phục hoàn toàn trên trình duyệt này. Hãy xóa toàn bộ site data của holilihu.online rồi mở lại ứng dụng.";}})();</script></body></html>';
    }

    # Static Assets — serve directly from nginx (fast, cached, hashed filenames = immutable)
    # NOTE: add_header in child blocks overrides parent — re-add security headers
    # Browser-assisted site data clear using the Clear-Site-Data header.
    # This is stronger than /reset-sw and will sign the user out.
    location = /clear-site-data {
        default_type text/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Clear-Site-Data "\"cache\", \"cookies\", \"storage\", \"executionContexts\"" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'self';" always;
        return 200 '<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Làm sạch dữ liệu trình duyệt</title></head><body style="font-family:system-ui,Segoe UI,sans-serif;max-width:680px;margin:0 auto;padding:32px;line-height:1.55;color:#0f172a"><h2 style="margin:0 0 12px">Đang làm sạch dữ liệu ứng dụng...</h2><p style="margin:0 0 16px;color:#475569">Trình duyệt đang xóa cache, cookie, service worker và bộ nhớ cục bộ của <strong>holilihu.online</strong>.</p><p style="margin:0;color:#64748b;font-size:14px">Bạn sẽ được chuyển về màn đăng nhập sau vài giây. Nếu trình duyệt không tự chuyển, chỉ cần mở lại ứng dụng và đăng nhập lại.</p><script>const params=new URLSearchParams(location.search);const returnUrl=params.get("returnUrl")||"/auth/login?message=Đã làm sạch dữ liệu trình duyệt. Hãy đăng nhập lại.";setTimeout(()=>{location.href=returnUrl;},1800);</script></body></html>';
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif|map|webmanifest)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        access_log off;
        try_files $uri =404;
    }

    # Known static files — serve directly (robots.txt, sitemap.xml, sw files)
    location ~* ^/(robots\.txt|sitemap\.xml|sw-wrapper\.js|safety-worker\.js|index\.csr\.html)$ {
        try_files $uri =404;
    }

    # API Proxy to Backend Service
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE support (AI streaming)
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;

        # Timeouts for long-running requests
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;

        # File upload size
        client_max_body_size 60m;
    }

    # Uploads Proxy (LocalStorageService files)
    location /uploads/ {
        proxy_pass http://backend:8080/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Actuator Health Check Proxy (restrict to /health only)
    location = /actuator/health {
        proxy_pass http://backend:8080/actuator/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Swagger UI Proxy (Caddy handles in prod, nginx proxy for dev/compose)
    location /swagger-ui {
        proxy_pass http://backend:8080/swagger-ui;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /v3/api-docs {
        proxy_pass http://backend:8080/v3/api-docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # SSR: Proxy page requests to Node.js (Angular SSR on port 4000)
    # If Node.js is down, fall back to CSR (index.csr.html)
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Graceful SSR fallback: if Node.js crashes, serve CSR shell
        proxy_intercept_errors on;
        error_page 502 503 504 = /index.csr.html;
    }

    # Health check endpoint
    location /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }
}
