<div class="rounded-xl border border-green-200 bg-green-50 p-4">
  <div class="mb-4 space-y-1">
    <h4 class="font-medium text-green-900">Thông tin bài tập</h4>
    <p class="text-sm text-green-800">
      Giữ phần mô tả và tiêu chí mặc định của bài tập ngay trong bài học. Việc giao theo lớp hoặc theo học viên sẽ được quản lý ở màn cài đặt bài tập.
    </p>
  </div>

  <div class="space-y-4">
    <div>
      <label class="mb-1 block text-sm font-medium text-green-700">Mô tả</label>
      <textarea
        [ngModel]="description()"
        (ngModelChange)="onDescriptionChange($event)"
        rows="3"
        placeholder="Tóm tắt ngắn gọn yêu cầu của bài tập"
        class="w-full resize-none rounded-lg border border-green-200 bg-white px-3 py-2"></textarea>
    </div>

    <div>
      <label class="mb-1 block text-sm font-medium text-green-700">Hướng dẫn nộp bài</label>
      <textarea
        [ngModel]="instructions()"
        (ngModelChange)="onInstructionsChange($event)"
        rows="4"
        placeholder="Mô tả rõ định dạng, tiêu chí đánh giá, hoặc các bước học viên cần làm"
        class="w-full resize-y rounded-lg border border-green-200 bg-white px-3 py-2"></textarea>
    </div>

    <div class="grid gap-4 md:grid-cols-2">
      <div>
        <label class="mb-1 block text-sm font-medium text-green-700">Hạn nộp</label>
        <input
          type="datetime-local"
          [ngModel]="dueDate()"
          (ngModelChange)="onDueDateChange($event)"
          class="w-full rounded-lg border border-green-200 bg-white px-3 py-2">
        <p class="mt-1 text-xs text-slate-500">Bỏ trống nếu bài học này không có hạn nộp mặc định.</p>
      </div>

      <div>
        <label class="mb-1 block text-sm font-medium text-green-700">Điểm tối đa</label>
        <input
          type="number"
          min="1"
          [ngModel]="maxScore()"
          (ngModelChange)="onMaxScoreChange($event)"
          class="w-full rounded-lg border border-green-200 bg-white px-3 py-2">
        <p class="mt-1 text-xs text-slate-500">Giá trị này sẽ được dùng làm mặc định khi mở cài đặt bài tập.</p>
      </div>
    </div>
  </div>
</div>
