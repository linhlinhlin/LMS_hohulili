<!-- Section list header -->
<div class="sections-header">
  <label class="editor-label">Nội dung ({{ sections().length }} mục)</label>
  <div class="sections-header__actions">
    <button type="button" (click)="onCreateSection('TEXT')" class="sections-add-btn">+ Bài giảng</button>
    <button type="button" (click)="onCreateSection('VIDEO')" class="sections-add-btn">+ Video</button>
    <button type="button" (click)="onCreateSection('FILE')" class="sections-add-btn sections-add-btn--file">+ Tài liệu</button>
    <button type="button" (click)="onCreateSection('QUIZ')" class="sections-add-btn sections-add-btn--quiz">+ Trắc nghiệm</button>
  </div>
</div>

<!-- Section list -->
@if (sections().length === 0) {
  <p class="editor-empty-state sections-empty">Chưa có nội dung. Thêm bài giảng, video, tài liệu hoặc trắc nghiệm ở trên.</p>
} @else {
  <div class="sections-list"
       cdkDropList cdkDropListLockAxis="y"
       [cdkDropListData]="sections()"
       (cdkDropListDropped)="onDropSection($event)">
    @for (section of sections(); track section.id) {
      <div class="section-row" (click)="onEditSection(section)" cdkDrag>
        <!-- Drag handle -->
        <div class="section-row__handle" cdkDragHandle>
          <lucide-icon name="grip-vertical" [size]="14"></lucide-icon>
        </div>

        <!-- Content -->
        <div class="section-row__content">
          <span class="section-row__title">{{ stripSectionPrefix(section.title) }}</span>
          <div class="section-row__meta">
            <span class="section-row__type">{{ getSectionTypeLabel(section.type) }}</span>
            @if (section.isRequired) {
              <span class="section-row__required">Bắt buộc</span>
            }
          </div>
        </div>

        <!-- Delete -->
        <button type="button"
          (click)="onDeleteSection(section.id, $event)"
          class="section-row__delete"
          aria-label="Xóa">
          <lucide-icon name="trash-2" [size]="14"></lucide-icon>
        </button>
      </div>
    }
  </div>
}
