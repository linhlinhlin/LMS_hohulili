<div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6 m-4">
    <div class="flex justify-between items-center mb-6">
        <h2 class="text-xl font-bold text-gray-900">Danh sách Học viên</h2>
        <div class="space-x-2">
            <button (click)="goBack()"
                class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50">
                Quay lại
            </button>
            <button (click)="openAddStudentDialog()"
                class="px-4 py-2 bg-[#0056D2] text-white rounded-md hover:bg-[#004BB5]">
                + Thêm Học viên
            </button>
        </div>
    </div>

    <div class="overflow-x-auto">
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
                <tr>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Họ và Tên
                    </th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Email
                    </th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Ngày tham
                        gia</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Tiến độ
                    </th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Trạng
                        thái</th>
                </tr>
            </thead>
            <tbody class="bg-white divide-y divide-gray-200">
                @for (s of students(); track s.id) {
                <tr>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">{{ s.fullName }}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{ s.email }}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{ s.enrolledAt | date:'dd/MM/yyyy' }}
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{ s.progress }}%</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                        <span [class.bg-green-100]="s.status==='ACTIVE'" [class.text-green-800]="s.status==='ACTIVE'"
                            class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-gray-100 text-gray-800">
                            {{ s.status }}
                        </span>
                    </td>
                </tr>
                }
                @if (students().length === 0) {
                <tr>
                    <td colspan="5" class="px-6 py-4 text-center text-gray-500">Chưa có học viên nào.</td>
                </tr>
                }
            </tbody>
        </table>
    </div>
</div>

<!-- Enrollment Drawer -->
<app-add-student-drawer [isOpen]="isDrawerOpen()" (isOpenChange)="isDrawerOpen.set($event)" [classId]="classId"
    (onSaved)="loadStudents()">
</app-add-student-drawer>
