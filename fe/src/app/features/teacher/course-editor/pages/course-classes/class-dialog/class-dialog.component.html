<h2 mat-dialog-title class="font-bold text-xl mb-4 border-b pb-2">
    {{ data.mode === 'create' ? 'Tạo lớp học mới' : 'Cập nhật lớp học' }}
</h2>

<mat-dialog-content>
    <form [formGroup]="form" class="space-y-4 py-2">

        <!-- Tên lớp -->
        <div>
            <label class="block text-sm font-medium text-gray-700">Tên lớp học <span
                    class="text-red-500">*</span></label>
            <input type="text" formControlName="name"
                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border"
                placeholder="VD: Lớp 2024A - Kỹ thuật máy">
        </div>

        <!-- Teacher Selection -->
        <div>
            <label class="block text-sm font-medium text-gray-700">Giáo viên phụ trách</label>
            <input type="text" [formControl]="teacherSearchControl" [matAutocomplete]="auto"
                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border"
                placeholder="Tìm kiếm giáo viên (Tên/Email)...">
            <mat-autocomplete #auto="matAutocomplete" [displayWith]="displayTeacherFn"
                (optionSelected)="onTeacherSelected($event)">
                <mat-option *ngFor="let teacher of filteredTeachers | async" [value]="teacher">
                    <span class="font-medium">{{ teacher.fullName }}</span>
                    <span class="text-gray-500 text-xs ml-2">{{ teacher.email }}</span>
                </mat-option>
            </mat-autocomplete>
        </div>

        <!-- Loại lịch học (Radio Button) -->
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Loại thời gian</label>
            <div class="flex space-x-6">
                <label class="inline-flex items-center cursor-pointer">
                    <input type="radio" formControlName="scheduleType" value="SEMESTER"
                        class="text-blue-600 focus:ring-blue-500">
                    <span class="ml-2 text-gray-700">Theo Học kỳ</span>
                </label>
                <label class="inline-flex items-center cursor-pointer">
                    <input type="radio" formControlName="scheduleType" value="CUSTOM"
                        class="text-blue-600 focus:ring-blue-500">
                    <span class="ml-2 text-gray-700">Tùy chỉnh</span>
                </label>
            </div>
        </div>

        <!-- Input Học kỳ (Chỉ hiện khi type = SEMESTER) -->
        <div *ngIf="form.get('scheduleType')?.value === 'SEMESTER'" class="bg-blue-50 p-4 rounded-md space-y-3">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Học kỳ</label>
                    <select formControlName="semesterIndex"
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border bg-white focus:border-blue-500 focus:ring-blue-500">
                        <option value="1">Học kỳ 1</option>
                        <option value="2">Học kỳ 2</option>
                        <option value="3">Học kỳ 3</option>
                        <option value="Hè">Học kỳ Hè</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Năm học</label>
                    <input type="number" formControlName="year"
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:border-blue-500 focus:ring-blue-500"
                        placeholder="YYYY">
                </div>
            </div>
            <p class="text-xs text-blue-600 italic">Mã học kỳ sẽ là:
                HK{{form.get('semesterIndex')?.value}}-{{form.get('year')?.value}}</p>
        </div>

        <!-- Date Range -->
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Ngày bắt đầu <span
                        class="text-red-500">*</span></label>
                <input type="date" formControlName="startDate"
                    class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Ngày kết thúc <span
                        class="text-red-500">*</span></label>
                <input type="date" formControlName="endDate"
                    class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
            </div>
        </div>

        <!-- Số lượng tối đa -->
        <div>
            <label class="block text-sm font-medium text-gray-700">Số lượng học viên tối đa <span
                    class="text-red-500">*</span></label>
            <input type="number" formControlName="maxStudents"
                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border" min="1">
        </div>

    </form>
</mat-dialog-content>

<mat-dialog-actions align="end" class="pt-4 border-t mt-4 gap-2">
    <button mat-button (click)="close()" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded">Hủy bỏ</button>
    <button mat-raised-button color="primary" [disabled]="form.invalid" (click)="save()"
        class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 disabled:opacity-50">
        {{ data.mode === 'create' ? 'Tạo mới' : 'Lưu thay đổi' }}
    </button>
</mat-dialog-actions>
