<div class="filter-card">
  <div class="filter-row">
    <!-- Search Input -->
    <div class="filter-search">
      <div class="search-wrapper">
        <div class="search-icon-wrapper">
          <svg class="search-icon" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd"></path>
          </svg>
        </div>
        <input type="text"
               [value]="state.searchQuery()"
               (input)="state.onSearchInput($any($event.target).value)"
               placeholder="Tìm kiếm theo tên hoặc email..."
               class="search-input">
      </div>
    </div>
    <!-- Filter Controls -->
    <div class="filter-controls">
      <!-- Role Filter -->
      <select [value]="state.roleFilter()"
              (change)="state.onRoleFilterChange($any($event.target).value)"
              class="filter-select">
        <option value="">Tất cả vai trò</option>
        @for (roleOpt of state.ROLE_OPTIONS; track roleOpt.value) {
          <option [value]="roleOpt.value">{{ roleOpt.label }}</option>
        }
      </select>
      <!-- Status Filter — enum-based (ACTIVE/BLOCKED/RESTRICTED) thay vì
           legacy 'active'/'inactive' boolean để filter granular hơn (F-U1).
           Khớp `accountStatus` field trên `AdminUser`. -->
      <select [value]="state.statusFilter()"
              (change)="state.onStatusFilterChange($any($event.target).value)"
              class="filter-select">
        <option value="">Tất cả trạng thái</option>
        <option value="ACTIVE">Đang hoạt động</option>
        <option value="BLOCKED">Bị khóa</option>
        <option value="RESTRICTED">Hạn chế</option>
      </select>
    </div>
  </div>
  <!-- Clear Filters -->
  @if (state.searchQuery() || state.roleFilter() || state.statusFilter()) {
    <div class="filter-clear">
      <button (click)="state.clearFilters()" class="btn-clear">
        Xóa bộ lọc
      </button>
    </div>
  }
  <!-- Results Count -->
  <div class="filter-results">
    <p class="filter-results__text">
      Hiển thị <span class="filter-results__bold">{{ state.filteredUsers().length }}</span>
      trong tổng số <span class="filter-results__bold">{{ state.totalUsers() }}</span> người dùng
    </p>
  </div>
</div>
