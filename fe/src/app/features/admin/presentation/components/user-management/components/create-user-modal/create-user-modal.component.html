<app-dialog
  [open]="state.showCreateModal()"
  title="Thêm người dùng mới"
  size="md"
  (close)="state.closeCreateUserModal()">
  <form (ngSubmit)="state.createUser()" class="create-user-form">
    <div class="form-field">
      <label class="form-label" for="create-user-name">
        Tên người dùng <span class="required-mark">*</span>
      </label>
      <input id="create-user-name"
             type="text"
             [ngModel]="state.newUserName()"
             (ngModelChange)="state.newUserName.set($event)"
             name="name"
             required
             placeholder="Nhập tên đầy đủ"
             class="form-input">
    </div>

    <div class="form-field">
      <label class="form-label" for="create-user-email">
        Email <span class="required-mark">*</span>
      </label>
      <input id="create-user-email"
             type="email"
             [ngModel]="state.newUserEmail()"
             (ngModelChange)="state.newUserEmail.set($event)"
             name="email"
             required
             placeholder="example@domain.com"
             class="form-input">
    </div>

    <div class="form-field">
      <label class="form-label" for="create-user-role">
        Vai trò <span class="required-mark">*</span>
      </label>
      <select id="create-user-role"
              [ngModel]="state.newUserRole()"
              (ngModelChange)="state.newUserRole.set($event)"
              name="role"
              required
              class="form-select">
        <option value="">Chọn vai trò</option>
        @for (roleOpt of state.ROLE_OPTIONS; track roleOpt.value) {
          <option [value]="roleOpt.value">{{ roleOpt.label }}</option>
        }
      </select>
    </div>

    <div class="info-note">
      <div class="info-note-inner">
        <svg class="info-icon" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"></path>
        </svg>
        <p class="info-text">
          Mật khẩu mặc định là <span class="info-bold">Password123!</span>. Người dùng nên đổi mật khẩu sau lần đăng nhập đầu tiên.
        </p>
      </div>
    </div>
  </form>

  <div dialogFooter>
    <button (click)="state.closeCreateUserModal()" type="button" class="btn-secondary">
      Hủy
    </button>
    <button (click)="state.createUser()"
            type="button"
            [disabled]="!state.newUserName() || !state.newUserEmail() || !state.newUserRole()"
            class="btn-primary">
      Tạo người dùng
    </button>
  </div>
</app-dialog>
