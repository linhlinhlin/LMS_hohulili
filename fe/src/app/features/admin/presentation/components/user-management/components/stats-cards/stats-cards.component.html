<div class="stats-grid">
  <app-kpi-card
    [value]="state.totalUsers()"
    label="Tổng người dùng"
    [sub]="state.activeUsers() + ' đang hoạt động'" />

  <app-kpi-card
    [value]="state.totalTeachers()"
    label="Giảng viên"
    sub="Đang giảng dạy" />

  <app-kpi-card
    [value]="state.totalStudents()"
    label="Học viên"
    sub="Đang học tập" />

  <app-kpi-card
    [value]="state.totalAdmins()"
    label="Quản trị viên"
    sub="Quản lý hệ thống" />
</div>
