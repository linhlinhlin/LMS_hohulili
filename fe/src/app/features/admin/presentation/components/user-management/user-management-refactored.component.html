<div class="um-page">
  <div class="um-container">
    <!-- Header Section -->
    <div class="um-header">
      <div class="um-header__row">
        <div>
          <h1 class="um-header__title">Quản lý người dùng</h1>
          <p class="um-header__subtitle">Quản lý và theo dõi tất cả người dùng trong hệ thống</p>
        </div>
        <div class="um-header__actions">
          <button (click)="state.openCreateUserModal()"
                  class="btn-primary">
            <svg class="btn-icon" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd"></path>
            </svg>
            Thêm người dùng
          </button>
          <button (click)="state.openBulkImportModal()"
                  class="btn-outline">
            <svg class="btn-icon" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd"></path>
            </svg>
            Import Excel
          </button>
        </div>
      </div>
    </div>

    <!-- Stats Cards -->
    <app-user-stats-cards />

    <!-- Search and Filter -->
    <app-user-search-filter />

    <!-- Users Table -->
    <app-users-table (statusAction)="onStatusAction($event)" />
  </div>
</div>

<!-- Modals -->
<app-create-user-modal />
<app-edit-user-modal />
<app-bulk-import-modal
  (startImport)="startBulkImport()"
  (downloadTemplate)="downloadTemplate()" />

<!-- Bulk action bar — slides up from bottom while selectedCount > 0. -->
<app-bulk-action-bar
  [selectedCount]="state.selectedCount()"
  [actions]="bulkActions()"
  countLabel="người dùng đã chọn"
  (actionClick)="onBulkAction($event)"
  (clear)="state.clearSelection()" />
