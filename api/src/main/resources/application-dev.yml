spring:
  config:
    activate:
      on-profile: dev
  datasource:
    # ===============================================
    # SUPABASE Pooler - TRANSACTION MODE (Port 6543)
    # ===============================================
    # SOTA: Use Transaction Mode for web APIs (Google/AWS/Supabase best practice)
    # - Port 5432 = Session Mode (holds connection permanently) ❌
    # - Port 6543 = Transaction Mode (connection per transaction) ✅
    url: jdbc:postgresql://aws-1-ap-southeast-1.pooler.supabase.com:6543/postgres?prepareThreshold=0
    username: postgres.rljldvpboqapokzecfff
    password: ho_hu_li_li_
    driver-class-name: org.postgresql.Driver

    # ===============================================
    # LOCAL PostgreSQL - Development (fallback)
    # ===============================================
    # Install: https://www.postgresql.org/download/
    # Or Docker: docker run --name lms-postgres -e POSTGRES_DB=lms -e POSTGRES_USER=lms -e POSTGRES_PASSWORD=lms -p 5432:5432 -d postgres:15
    # url: jdbc:postgresql://localhost:5432/lms
    # username: lms
    # password: lms

    # SOTA HikariCP Configuration for Transaction Mode (optimized)
    hikari:
      maximum-pool-size: 3             # Lower for Transaction Mode - connections are quickly returned
      minimum-idle: 1                  # Minimal idle - Transaction Mode efficiently reuses
      connection-timeout: 20000        # 20s - faster fail for cloud latency
      idle-timeout: 300000             # 5 minutes - shorter for Transaction Mode
      max-lifetime: 1800000            # 30 minutes - Supabase recommendation
      keepalive-time: 30000            # 30s keepalive to prevent connection reset
      validation-timeout: 5000         # 5s validation
      connection-test-query: SELECT 1  # Validate connections before use
      leak-detection-threshold: 60000  # Detect connection leaks
  jpa:
    hibernate:
      ddl-auto: update    # Keep 'update' for dev - database may need schema changes
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 25
          fetch_size: 50
    open-in-view: false     # SOTA: Disable OSIV for better performance
  flyway:
    enabled: false
    baseline-on-migrate: true
    baseline-version: 1
    out-of-order: true
    ignore-missing-migrations: true
logging:
  level:
    org.springframework.web: DEBUG

server:
  port: 8088

