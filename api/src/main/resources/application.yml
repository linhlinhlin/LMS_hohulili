# ==== Common ====
server:
  shutdown: graceful

spring:
  application:
    name: backend-lms-postgres
  threads:
    virtual:
      enabled: true
  profiles:
    active: dev
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true  # Required for existing databases
    baseline-version: 25       # Baseline after V25, apply V26+ migrations
    locations: classpath:db/migration
    validate-on-migrate: true
    out-of-order: true         # Allow V26, V27 to run after V20251221

management:
  endpoints:
    web:
      exposure:
        include: "health,info"

logging:
  level:
    root: INFO
    com.example.lms: DEBUG
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
    org.springframework.orm.jpa: DEBUG
    org.springframework.transaction: DEBUG

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui
    operationsSorter: method
    tagsSorter: alpha
    displayRequestDuration: true

# JWT Configuration
app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration: 86400000  # 24 hours in milliseconds
    refresh-expiration: 604800000  # 7 days in milliseconds

# AI Service Configuration
# Updated: 10/12/2025 - API Key từ Team AI
ai:
  service:
    url: ${AI_SERVICE_URL:https://maritime-ai-chatbot.onrender.com}
    api-key: ${AI_SERVICE_API_KEY:maritime-lms-prod-2024}
    timeout: ${AI_SERVICE_TIMEOUT:90}  # seconds
    retry:
      max-attempts: ${AI_SERVICE_RETRY_MAX:2}
      delay: ${AI_SERVICE_RETRY_DELAY:1000}  # milliseconds
