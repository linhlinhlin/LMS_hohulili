# ==== Common ====
server:
  shutdown: graceful
  servlet:
    encoding:
      charset: UTF-8
      force: true
      enabled: true

spring:
  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  application:
    name: backend-lms-postgres
  threads:
    virtual:
      enabled: true
  profiles:
    active: dev
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false
    baseline-on-migrate: true
    baseline-version: 1
    out-of-order: true
    ignore-missing-migrations: true

  # SOTA: Enable case-insensitive enum deserialization
  jackson:
    mapper:
      accept-case-insensitive-enums: true

management:
  endpoints:
    web:
      exposure:
        include: "health,info"

logging:
  level:
    root: INFO
    com.example.lms: DEBUG
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
    org.springframework.orm.jpa: DEBUG
    org.springframework.transaction: DEBUG

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui
    operationsSorter: method
    tagsSorter: alpha
    displayRequestDuration: true

# JWT Configuration
app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration: 86400000  # 24 hours in milliseconds
    refresh-expiration: 604800000  # 7 days in milliseconds
  # Cloudflare R2 configuration (S3 compatible)
  r2:
    # Toggle Cloudflare R2 integration. When false/missing, R2 beans/controllers are disabled.
    enabled: ${R2_ENABLED:false}
    account-id: ${R2_ACCOUNT_ID:}
    access-key-id: ${R2_ACCESS_KEY_ID:}
    secret-access-key: ${R2_SECRET_ACCESS_KEY:}
    bucket: ${R2_BUCKET:}
    # Endpoint examples:
    # - https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com
    # - https://<your-public-bucket>.r2.dev (for public access)
    endpoint: ${R2_ENDPOINT:https://example.r2.dev}
    # Public base URL for serving files (no auth). If using a private bucket, leave blank.
    public-base-url: ${R2_PUBLIC_BASE_URL:}
    presign-ttl-seconds: ${R2_PRESIGN_TTL:900}

# AI Service Configuration
# Updated: 10/12/2025 - API Key từ Team AI
ai:
  service:
    url: ${AI_SERVICE_URL:https://maritime-ai-chatbot.onrender.com}
    api-key: ${AI_SERVICE_API_KEY:maritime-lms-prod-2024}
    timeout: ${AI_SERVICE_TIMEOUT:90}  # seconds
    retry:
      max-attempts: ${AI_SERVICE_RETRY_MAX:2}
      delay: ${AI_SERVICE_RETRY_DELAY:1000}  # milliseconds

# =====================================================
# PAYMENT GATEWAY CONFIGURATION
# SOTA Design (Dec 2025): Gateway Abstraction Layer
# =====================================================
payment:
  # Default gateway code - change this to switch gateways
  # Options: SIMULATED, VNPAY, ZALOPAY, MOMO, OWN_SYSTEM
  default-gateway: ${PAYMENT_DEFAULT_GATEWAY:SIMULATED}
  
  # Frontend URLs
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  success-url: ${PAYMENT_SUCCESS_URL:${payment.frontend-url}/payment/success}
  failed-url: ${PAYMENT_FAILED_URL:${payment.frontend-url}/payment/failed}
  
  # === SIMULATED GATEWAY (Development/Testing) ===
  simulated:
    enabled: true  # Always enabled in dev
  
  # === VNPAY GATEWAY ===
  # Register at: https://sandbox.vnpayment.vn
  # Docs: https://sandbox.vnpayment.vn/apis/docs/thanh-toan-pay/pay.html
  vnpay:
    enabled: ${VNPAY_ENABLED:false}
    tmn-code: ${VNPAY_TMN_CODE:}
    hash-secret: ${VNPAY_HASH_SECRET:}
    url: ${VNPAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    return-url: ${VNPAY_RETURN_URL:${payment.frontend-url}/payment/callback/vnpay}
    api-url: ${VNPAY_API_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
  
  # === ZALOPAY GATEWAY (Future) ===
  # Register at: https://zalopay.vn
  zalopay:
    enabled: ${ZALOPAY_ENABLED:false}
    app-id: ${ZALOPAY_APP_ID:}
    key1: ${ZALOPAY_KEY1:}
    key2: ${ZALOPAY_KEY2:}
    endpoint: ${ZALOPAY_ENDPOINT:https://sb-openapi.zalopay.vn/v2/create}
    callback-url: ${ZALOPAY_CALLBACK_URL:${payment.frontend-url}/payment/callback/zalopay}
  
  # === MOMO GATEWAY (Future) ===
  # Register at: https://business.momo.vn
  momo:
    enabled: ${MOMO_ENABLED:false}
    partner-code: ${MOMO_PARTNER_CODE:}
    access-key: ${MOMO_ACCESS_KEY:}
    secret-key: ${MOMO_SECRET_KEY:}
    endpoint: ${MOMO_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api}
    callback-url: ${MOMO_CALLBACK_URL:${payment.frontend-url}/payment/callback/momo}
  
  # === OWN PAYMENT SYSTEM (Future) ===
  # Enable this when you build your own payment system
  own-system:
    enabled: ${OWN_PAYMENT_ENABLED:false}
    api-url: ${OWN_PAYMENT_API_URL:}
    api-key: ${OWN_PAYMENT_API_KEY:}

