services:
  db:
    image: postgres:16-alpine
    container_name: lms-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=lms
      - POSTGRES_PASSWORD=lms
      - POSTGRES_DB=lms
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms -d lms"]
      interval: 5s
      timeout: 3s
      retries: 20

  pgadmin:
    image: dpage/pgadmin4
    ports:
      - "8081:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@devmail.net}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-devonly123}
    depends_on:
      - db

  api:
    build: .
    container_name: lms-backend
    ports:
      - "8088:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/lms
      - SPRING_DATASOURCE_USERNAME=lms
      - SPRING_DATASOURCE_PASSWORD=lms
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_FROM=${MAIL_FROM:-}
      # Wiii AI Integration (Sprint 220+226: separate server)
      - WIII_WEBHOOK_URL=http://localhost:8000/api/v1/lms/webhook/maritime-lms
      - WIII_WEBHOOK_SECRET=wiii-lms-hmac-s3cr3t-2026
      - WIII_WEBHOOK_ENABLED=true
      - WIII_SERVICE_TOKEN=wiii-service-token-shared-secret
      - WIII_TOKEN_EXCHANGE_URL=http://localhost:8000/api/v1/auth/lms/token
      # Fix: Override upload base-url with host port (container=8080, host=8088)
      - APP_STORAGE_LOCAL_BASE_URL=http://localhost:8088/uploads
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: always
    networks:
      - default
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

volumes:
  pgdata:

  # wiii-network removed: Wiii now on separate server (Sprint 226)
