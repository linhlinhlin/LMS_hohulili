spring:
  config:
    activate:
      on-profile: dev
  datasource:
    # DB local Docker (Active for development)
    url: jdbc:postgresql://localhost:5432/lms
    username: lms
    password: lms
    driver-class-name: org.postgresql.Driver

    # Supabase (for production - commented out)
    # url: jdbc:postgresql://aws-1-ap-southeast-1.pooler.supabase.com:6543/postgres?pgbouncer=true&prepareThreshold=0&sslmode=require
    # username: postgres.rljldvpboqapokzecfff
    # password: ho_hu_li_li_

    # SOTA HikariCP Configuration (Dec 2025)
    # Formula: pool-size = (cores × 2) + 1
    # Reference: https://github.com/brettwooldridge/HikariCP/wiki/About-Pool-Sizing
    hikari:
      maximum-pool-size: 20           # ↑ from 10 (handle 15+ parallel FE requests in Docker)
      minimum-idle: 5                 # Fixed pool size recommended
      connection-timeout: 5000        # 5s "fail fast" strategy (↓ from 20s)
      idle-timeout: 300000            # 5 minutes
      max-lifetime: 1200000           # 20 minutes (< firewall timeout)
      leak-detection-threshold: 60000 # Detect connection leaks in dev
      pool-name: LMS-HikariPool
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        # Fix Hibernate 6.4 UUID array ClassCastException (HHH-17557)
        dialect.native_param_markers: false
        # SOTA Batch Fetching - Reduce N+1 queries
        default_batch_fetch_size: 16    # Load 16 lazy entities per batch
        jdbc.batch_size: 25             # Batch inserts/updates
        order_inserts: true             # Group inserts by entity type
        order_updates: true             # Group updates by entity type
        # Hypersistence Utils: Custom ObjectMapper with JavaTimeModule for JSONB
        types.jackson.object.mapper: com.example.lms.config.HibernateJsonConfig
    # CRITICAL: Disable Open Session In View anti-pattern
    # Reference: Netflix/Google explicitly disable this
    open-in-view: false
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    validate-on-migrate: false
    out-of-order: true
    clean-disabled: true

management:
  health:
    mail:
      enabled: false

logging:
  level:
    org.springframework.web: DEBUG
    # HikariCP monitoring
    com.zaxxer.hikari: INFO

server:
  port: ${SERVER_PORT:8080}  # Unified: 8080 everywhere for consistency
  tomcat:
    threads:
      max: 300              # ↑ from default 200 (handle parallel FE API calls)
      min-spare: 10
    accept-count: 200       # Queue size when all threads busy
    connection-timeout: 5000

# App config
app:
  storage:
    local:
      base-path: uploads
      base-url: http://localhost:8088/uploads
  email:
    from: "${MAIL_FROM:LMS Maritime <noreply@maritime.edu>}"
    base-url: "http://localhost:4200"
  vnpay:
    tmn-code: "${VNPAY_TMN_CODE:DEMOV210}"
    hash-secret: "${VNPAY_HASH_SECRET:DEMOSECRET}"
    pay-url: "https://sandbox.vnpayment.vn/paymentv2/vpcpay.html"
    return-url: "http://localhost:8088/api/v3/payments/vnpay-return"
    ipn-url: "http://localhost:8088/api/v3/payments/vnpay-ipn"
    expire-minutes: 15

# Disable Cloudflare R2 in dev — LocalStorageService activates as fallback
cloudflare:
  r2:
    enabled: false

# Wiii AI Integration (Sprint 175: "Cắm Phích Cắm")
# Secrets loaded from environment variables — NEVER hardcode in git
# Set these in your shell/IDE run config:
#   export WIII_WEBHOOK_SECRET=your-shared-secret
#   export WIII_SERVICE_TOKEN=your-service-token
#   export WIII_WEBHOOK_ENABLED=true
wiii:
  webhook:
    enabled: ${WIII_WEBHOOK_ENABLED:false}
  # secret and service-token already defined in application.yml with ${} placeholders


