# ==== Common ====
server:
  shutdown: graceful

spring:
  application:
    name: backend-lms-postgres
  threads:
    virtual:
      enabled: true
  profiles:
    active: dev
  servlet:
    multipart:
      enabled: true
      max-file-size: 500MB
      max-request-size: 500MB
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect.native_param_markers: false
        # Hypersistence Utils: Custom ObjectMapper with JavaTimeModule for JSONB
        types.jackson.object.mapper: com.example.lms.config.HibernateJsonConfig
  flyway:
    enabled: true
    baseline-on-migrate: true  # Required for existing databases
    baseline-version: 25       # Baseline after V25, apply V26+ migrations
    locations: classpath:db/migration
    validate-on-migrate: true
    out-of-order: true         # Allow V26, V27 to run after V20251221

management:
  endpoints:
    web:
      exposure:
        include: "health,info"

logging:
  level:
    root: INFO
    com.example.lms: DEBUG
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
    org.springframework.orm.jpa: DEBUG
    org.springframework.transaction: DEBUG

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui
    operationsSorter: method
    tagsSorter: alpha
    displayRequestDuration: true

# JWT Configuration - Externalized for security
app:
  jwt:
    secret: ${APP_JWT_SECRET:ZGV2ZWxvcG1lbnQtb25seS1zZWNyZXQta2V5LWZvci1sbXMtYXBwbGljYXRpb24tbWluaW11bS0yNTYtYml0cw==}
    expiration: ${APP_JWT_EXPIRATION:86400000}  # 24 hours in milliseconds
    refresh-expiration: ${APP_JWT_REFRESH_EXPIRATION:604800000}  # 7 days in milliseconds

# AI Service Configuration
# Updated: 10/12/2025 - API Key từ Team AI
ai:
  service:
    url: ${AI_SERVICE_URL:https://maritime-ai-chatbot.onrender.com}
    api-key: ${AI_SERVICE_API_KEY:}
    timeout: ${AI_SERVICE_TIMEOUT:90}  # seconds
    retry:
      max-attempts: ${AI_SERVICE_RETRY_MAX:2}
      delay: ${AI_SERVICE_RETRY_DELAY:1000}  # milliseconds

# Cloudflare R2 Storage Configuration - Externalized for security
# R2 is S3-compatible object storage with zero egress fees
cloudflare:
  r2:
    enabled: ${CLOUDFLARE_R2_ENABLED:true}
    account-id: ${CLOUDFLARE_R2_ACCOUNT_ID:}
    access-key: ${CLOUDFLARE_R2_ACCESS_KEY:}
    secret-key: ${CLOUDFLARE_R2_SECRET_KEY:}
    bucket: ${CLOUDFLARE_R2_BUCKET:lms-tracnghiemj-image}
    public-url: ${CLOUDFLARE_R2_PUBLIC_URL:}


