spring:
  config:
    activate:
      on-profile: prod

  # Database
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lms}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL:20}
      minimum-idle: ${HIKARI_MIN_IDLE:10}
      connection-timeout: 5000
      idle-timeout: 300000
      max-lifetime: 1200000

  # JPA - Production
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        show_sql: false
        default_batch_fetch_size: 16
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

  # Flyway - ENABLED in production
  # V1 has complete schema. Baseline at V53 = skip V1-V53.
  # New migrations (V54+) will run automatically.
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 53
    locations: classpath:db/migration
    validate-on-migrate: false

  # File upload limits
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB

server:
  port: 8080
  # Trust Caddy reverse proxy headers (X-Forwarded-For, X-Forwarded-Proto)
  forward-headers-strategy: NATIVE
  # Production: Graceful shutdown
  shutdown: graceful
  tomcat:
    connection-timeout: 5000
    max-connections: 200
    accept-count: 100

# App Configuration
app:
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:https://holilihu.online}
  jwt:
    secret: ${APP_JWT_SECRET}
    expiration: ${APP_JWT_EXPIRATION:86400000}
    refresh-expiration: ${APP_JWT_REFRESH_EXPIRATION:604800000}
  storage:
    local:
      base-path: uploads
      base-url: ${APP_BASE_URL:https://holilihu.online}/uploads
  email:
    from: "LMS Maritime <noreply@maritime.edu>"
    base-url: "${APP_BASE_URL:https://holilihu.online}"
  resend:
    api-key: "${RESEND_API_KEY:}"
  vnpay:
    tmn-code: "${VNPAY_TMN_CODE:}"
    hash-secret: "${VNPAY_HASH_SECRET:}"
    pay-url: "https://pay.vnpay.vn/vpcpay.html"
    return-url: "${APP_BASE_URL:https://holilihu.online}/payment/result"
    ipn-url: "${APP_BASE_URL:https://holilihu.online}/api/v3/payments/vnpay-ipn"
    expire-minutes: 15

# R2 Storage (set R2_ENABLED=false to use LocalStorageService)
cloudflare:
  r2:
    enabled: ${CLOUDFLARE_R2_ENABLED:false}
    account-id: ${CLOUDFLARE_R2_ACCOUNT_ID:}
    access-key: ${CLOUDFLARE_R2_ACCESS_KEY:}
    secret-key: ${CLOUDFLARE_R2_SECRET_KEY:}
    bucket-name: ${CLOUDFLARE_R2_BUCKET:lms-files}
    public-url: ${CLOUDFLARE_R2_PUBLIC_URL:}

# Actuator - Production endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  health:
    mail:
      enabled: false

# Logging - Production
logging:
  level:
    root: WARN
    com.example.lms: INFO
    org.hibernate.SQL: WARN
    org.springframework.security: WARN
