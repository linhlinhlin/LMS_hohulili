# hypersistence-utils Configuration
#
# This file is the ONLY mechanism that activates Phase 8 Level 3 Custom JsonSerializer.
# DO NOT delete or rename without auditing all JSONB POJOs for Serializable compliance.
#
# Background:
# hypersistence-utils' Configuration class (io.hypersistence.utils.hibernate.type.util.Configuration)
# reads properties from THIS classpath file + System properties + Hibernate Environment.getProperties().
# It does NOT read from Spring's `spring.jpa.properties.hibernate.*` map. Setting the property
# in application.yml is silently ignored — verified empirically 2026-04-27.
#
# Reference:
#   - hypersistence-utils-hibernate-63 v3.15.2 source: Configuration.java
#   - Phase 8 design doc: docs/architecture/PHASE10_SCHEMA_REFACTOR_PROGRESS_TABLE.md
#   - ArchUnit guard (Layer 2): JsonbSerializableTest.java

# Layer 3: Bypass Java Serializable requirement for JSONB deepCopy.
# Uses Jackson round-trip (writeValueAsBytes + readValue) instead of SerializationUtils.clone().
hypersistence.utils.json.serializer=com.example.lms.config.JacksonCloneJsonSerializer

# Custom ObjectMapper supplier (JavaTimeModule + ISO dates).
hypersistence.utils.jackson.object.mapper=com.example.lms.config.HibernateJsonConfig

# Suppress hypersistence-utils banner at startup.
hypersistence.utils.print.banner=false
