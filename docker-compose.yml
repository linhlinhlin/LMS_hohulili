# =============================================================================
# LMS Maritime - Docker Compose Base Configuration
# Dev:  docker compose --env-file .env.dev -f docker-compose.yml -f docker-compose.dev.yml up
# Prod: docker compose --env-file .env.prod -f docker-compose.yml -f docker-compose.prod.yml up -d
# =============================================================================

services:
  # ===== PostgreSQL Database =====
  db:
    image: postgres:16-alpine
    container_name: lms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lms}
      POSTGRES_DB: ${POSTGRES_DB:-lms}
    volumes:
      - lms-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lms} -d ${POSTGRES_DB:-lms}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - lms-backend

  # ===== Spring Boot Backend =====
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lms-backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      # Database
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-lms}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-lms}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-lms}
      # JWT (externalized)
      APP_JWT_SECRET: ${JWT_SECRET:-development-only-secret-change-in-prod}
      APP_JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      APP_JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800000}
      # R2 Storage
      CLOUDFLARE_R2_ENABLED: ${R2_ENABLED:-false}
      CLOUDFLARE_R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      CLOUDFLARE_R2_ACCESS_KEY: ${R2_ACCESS_KEY:-}
      CLOUDFLARE_R2_SECRET_KEY: ${R2_SECRET_KEY:-}
      CLOUDFLARE_R2_BUCKET: ${R2_BUCKET:-lms-tracnghiemj-image}
      CLOUDFLARE_R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
      # App URLs
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:4200}
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:-http://localhost:4200}
      # AI Service
      AI_SERVICE_URL: ${AI_SERVICE_URL:-https://maritime-ai-chatbot.onrender.com}
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY:-}
      # Email
      SPRING_MAIL_HOST: ${MAIL_HOST:-}
      SPRING_MAIL_PORT: ${MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      # VNPay
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-}
      VNPAY_PAY_URL: ${VNPAY_PAY_URL:-}
      # JVM Container Optimization
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"
    volumes:
      - lms-uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - lms-backend
      - lms-frontend

  # ===== Angular Frontend (nginx) =====
  frontend:
    build:
      context: ./fe
      dockerfile: Dockerfile
    container_name: lms-frontend
    depends_on:
      - backend
    networks:
      - lms-frontend

# ===== Named Volumes =====
volumes:
  lms-pgdata:
    name: lms-pgdata
  lms-uploads:
    name: lms-uploads

# ===== Networks =====
networks:
  lms-backend:
    name: lms-backend
    driver: bridge
    internal: true  # No external access - security best practice
  lms-frontend:
    name: lms-frontend
    driver: bridge
