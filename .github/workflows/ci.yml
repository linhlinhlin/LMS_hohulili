name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run backend tests
        run: mvn test -B

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: fe
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: fe/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  compose:
    name: Compose Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Validate dev compose
        run: docker compose --env-file .env.dev.example -f docker-compose.yml -f docker-compose.dev.yml config -q

      - name: Validate prod compose
        run: docker compose --env-file .env.prod.example -f docker-compose.yml -f docker-compose.prod.yml config -q

  docker-smoke:
    name: Docker Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs:
      - backend
      - frontend
      - compose
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Build and boot dev stack
        run: docker compose --env-file .env.dev.example -f docker-compose.yml -f docker-compose.dev.yml up -d --build --wait

      - name: Verify backend health
        run: curl -fsS http://localhost:8088/actuator/health

      - name: Verify frontend edge
        run: |
          curl -fsSI http://localhost:4200/
          curl -fsS http://localhost:4200/actuator/health

      - name: Print stack diagnostics on failure
        if: failure()
        run: |
          docker compose --env-file .env.dev.example -f docker-compose.yml -f docker-compose.dev.yml ps
          docker compose --env-file .env.dev.example -f docker-compose.yml -f docker-compose.dev.yml logs --tail=200

      - name: Tear down stack
        if: always()
        run: docker compose --env-file .env.dev.example -f docker-compose.yml -f docker-compose.dev.yml down -v --remove-orphans
