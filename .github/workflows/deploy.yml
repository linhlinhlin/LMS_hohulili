# =============================================================================
# LMS Maritime — Build & Deploy Pipeline
#
# Flow: push to main → build images in parallel → push to GHCR → SSH deploy
# VM only pulls pre-built images — no build on production server.
#
# Required GitHub Environment "production" with:
#   Secrets: DEPLOY_SSH_PRIVATE_KEY, DEPLOY_KNOWN_HOSTS
#   Variables: DEPLOY_HOST, DEPLOY_USER, DEPLOY_APP_DIR
# =============================================================================

name: Build & Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".claude/**"
  workflow_dispatch:
    inputs:
      skip_deploy:
        description: "Build images only (skip deploy to VM)"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/lms-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/lms-frontend

jobs:
  # ── Build Backend Image ──────────────────────────────────────────────
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
          provenance: false

  # ── Build Frontend Image ─────────────────────────────────────────────
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push frontend
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./fe
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
          provenance: false

  # ── Deploy to Production VM ──────────────────────────────────────────
  deploy:
    name: Deploy Production
    needs: [build-backend, build-frontend]
    if: github.event.inputs.skip_deploy != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://holilihu.online

    steps:
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy via SSH
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_APP_DIR: ${{ vars.DEPLOY_APP_DIR }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" << DEPLOY_EOF
          set -euo pipefail
          cd "$DEPLOY_APP_DIR"

          echo "=== LMS Maritime — CI/CD Deploy ==="
          echo "Revision: $DEPLOY_SHA"

          # Update compose files, Caddyfile
          git fetch --prune origin
          git checkout --force "$DEPLOY_SHA"

          COMPOSE_ARGS=(--env-file .env.prod -f docker-compose.yml -f docker-compose.prod.yml)

          # Backup database (if running)
          if docker compose "\${COMPOSE_ARGS[@]}" ps db --status running -q 2>/dev/null | grep -q .; then
            BACKUP_FILE="backups/lms-pre-deploy-\$(date +%Y%m%d-%H%M%S).sql.gz"
            mkdir -p backups
            docker compose "\${COMPOSE_ARGS[@]}" exec -T db \
              pg_dump -U "\${POSTGRES_USER:-lms}" "\${POSTGRES_DB:-lms}" | gzip > "\$BACKUP_FILE"
            echo "Backup: \$BACKUP_FILE"
          fi

          # Pull pre-built images from GHCR
          docker compose "\${COMPOSE_ARGS[@]}" pull backend frontend

          # Prune old images to save disk
          docker image prune -f 2>/dev/null || true

          # Deploy (no --build: uses pulled images)
          # --force-recreate backend frontend: ensures containers restart with the new image.
          # Without this, `up -d` may leave old containers running if Docker Compose
          # doesn't detect the image digest change reliably.
          docker compose "\${COMPOSE_ARGS[@]}" up -d --remove-orphans --force-recreate backend frontend

          # Reload Caddy config (Caddyfile is a bind-mount, not baked into image).
          # `caddy reload` is graceful — no dropped connections, no TLS downtime.
          docker compose "\${COMPOSE_ARGS[@]}" exec -T caddy caddy reload --config /etc/caddy/Caddyfile 2>/dev/null \
            && echo "Caddy: config reloaded" \
            || echo "WARNING: Caddy reload failed (may need manual restart)"

          # Wait for health
          echo "Waiting for backend health..."
          for i in \$(seq 1 30); do
            if curl -sf http://localhost/actuator/health > /dev/null 2>&1; then
              echo "Backend: HEALTHY"
              break
            fi
            [ "\$i" -eq 30 ] && echo "WARNING: Health check timed out"
            sleep 5
          done

          docker compose "\${COMPOSE_ARGS[@]}" ps
          echo "=== Deploy Complete ==="
          DEPLOY_EOF

      - name: Post-deploy summary
        run: |
          {
            echo "### Deploy completed"
            echo ""
            echo "- Revision: \`${{ github.sha }}\`"
            echo "- Backend: \`${{ env.BACKEND_IMAGE }}:${{ github.sha }}\`"
            echo "- Frontend: \`${{ env.FRONTEND_IMAGE }}:${{ github.sha }}\`"
            echo "- URL: https://holilihu.online"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove SSH material
        if: always()
        run: rm -f ~/.ssh/id_ed25519 ~/.ssh/known_hosts
