# =============================================================================
# Production Environment - Override Configuration
# Usage: docker compose --env-file .env.prod -f docker-compose.yml -f docker-compose.prod.yml up -d
# =============================================================================

services:
  db:
    # No port exposure in production - internal network only
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  backend:
    # NO ports exposed — Caddy proxies internally via lms-frontend network
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
      LOGGING_LEVEL_ROOT: WARN
      LOGGING_LEVEL_COM_EXAMPLE_LMS: INFO
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1536M
        reservations:
          cpus: '0.5'
          memory: 768M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  frontend:
    # NO ports exposed — Caddy proxies internally
    # Node.js SSR (~80-150MB) + nginx (~10MB) = ~200MB typical
    restart: always
    environment:
      NG_ALLOWED_HOSTS: "holilihu.online,localhost"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 384M

  # ===== Caddy Reverse Proxy (Auto-HTTPS) =====
  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3 QUIC
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    networks:
      - lms-frontend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:2019/config/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  caddy_data:
    name: caddy_data
  caddy_config:
    name: caddy_config
