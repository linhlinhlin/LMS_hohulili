<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">GitHub contribution flow</title>
  <desc id="desc">Issue to specification, branch, pull request, CI, review, merge, and deploy workflow for the LMS repository.</desc>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0056D2"/>
      <stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1280" height="520" fill="#F8FBFF"/>
  <text x="72" y="72" fill="#0F172A" font-family="Inter, Segoe UI, sans-serif" font-size="40" font-weight="900">
    Professional contribution flow
  </text>
  <text x="72" y="110" fill="#475569" font-family="Inter, Segoe UI, sans-serif" font-size="20" font-weight="600">
    Small, reviewable, verified changes from idea to production.
  </text>

  <path d="M180 265 H1100" stroke="url(#line)" stroke-width="8" stroke-linecap="round"/>

  <g font-family="Inter, Segoe UI, sans-serif" filter="url(#shadow)">
    <g transform="translate(82 175)">
      <rect width="164" height="130" rx="22" fill="#FFFFFF" stroke="#D8E4F2"/>
      <circle cx="82" cy="45" r="22" fill="#E8F1FF"/>
      <text x="82" y="52" text-anchor="middle" fill="#0056D2" font-size="22" font-weight="900">1</text>
      <text x="82" y="88" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="800">Issue</text>
      <text x="82" y="113" text-anchor="middle" fill="#64748B" font-size="13" font-weight="600">scope and priority</text>
    </g>
    <g transform="translate(254 175)">
      <rect width="164" height="130" rx="22" fill="#FFFFFF" stroke="#D8E4F2"/>
      <circle cx="82" cy="45" r="22" fill="#E8F1FF"/>
      <text x="82" y="52" text-anchor="middle" fill="#0056D2" font-size="22" font-weight="900">2</text>
      <text x="82" y="88" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="800">Spec</text>
      <text x="82" y="113" text-anchor="middle" fill="#64748B" font-size="13" font-weight="600">decision record</text>
    </g>
    <g transform="translate(426 175)">
      <rect width="164" height="130" rx="22" fill="#FFFFFF" stroke="#D8E4F2"/>
      <circle cx="82" cy="45" r="22" fill="#E8F1FF"/>
      <text x="82" y="52" text-anchor="middle" fill="#0056D2" font-size="22" font-weight="900">3</text>
      <text x="82" y="88" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="800">Branch</text>
      <text x="82" y="113" text-anchor="middle" fill="#64748B" font-size="13" font-weight="600">short-lived work</text>
    </g>
    <g transform="translate(598 175)">
      <rect width="164" height="130" rx="22" fill="#FFFFFF" stroke="#D8E4F2"/>
      <circle cx="82" cy="45" r="22" fill="#E8F1FF"/>
      <text x="82" y="52" text-anchor="middle" fill="#0056D2" font-size="22" font-weight="900">4</text>
      <text x="82" y="88" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="800">Pull Request</text>
      <text x="82" y="113" text-anchor="middle" fill="#64748B" font-size="13" font-weight="600">risk and tests</text>
    </g>
    <g transform="translate(770 175)">
      <rect width="164" height="130" rx="22" fill="#FFFFFF" stroke="#D8E4F2"/>
      <circle cx="82" cy="45" r="22" fill="#E8F1FF"/>
      <text x="82" y="52" text-anchor="middle" fill="#0056D2" font-size="22" font-weight="900">5</text>
      <text x="82" y="88" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="800">CI + Review</text>
      <text x="82" y="113" text-anchor="middle" fill="#64748B" font-size="13" font-weight="600">required checks</text>
    </g>
    <g transform="translate(942 175)">
      <rect width="164" height="130" rx="22" fill="#FFFFFF" stroke="#D8E4F2"/>
      <circle cx="82" cy="45" r="22" fill="#E8F1FF"/>
      <text x="82" y="52" text-anchor="middle" fill="#0056D2" font-size="22" font-weight="900">6</text>
      <text x="82" y="88" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="800">Squash Merge</text>
      <text x="82" y="113" text-anchor="middle" fill="#64748B" font-size="13" font-weight="600">clean history</text>
    </g>
  </g>

  <rect x="344" y="370" width="592" height="58" rx="18" fill="#FFFFFF" stroke="#D8E4F2"/>
  <text x="640" y="407" text-anchor="middle" fill="#334155" font-family="Inter, Segoe UI, sans-serif" font-size="18" font-weight="700">
    Main branch is production-truth: merge only when CI, review, docs, and rollback are clear.
  </text>
</svg>
