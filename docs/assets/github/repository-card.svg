<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">HoHoLiHu Maritime LMS repository card</title>
  <desc id="desc">A professional GitHub social card for the HoHoLiHu Maritime LMS project.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF6FF"/>
      <stop offset="0.5" stop-color="#F8FBFF"/>
      <stop offset="1" stop-color="#E8F3FF"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0056D2"/>
      <stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#0F172A" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="1120" cy="110" r="190" fill="#0056D2" opacity="0.08"/>
  <circle cx="130" cy="540" r="230" fill="#0891B2" opacity="0.08"/>

  <g filter="url(#softShadow)">
    <rect x="96" y="88" width="1088" height="464" rx="42" fill="#FFFFFF" stroke="#D8E4F2"/>
  </g>

  <g transform="translate(150 145)">
    <circle cx="72" cy="72" r="60" fill="#F8FBFF" stroke="#CFE1F6" stroke-width="2"/>
    <path d="M72 25 L84 62 L123 72 L84 82 L72 119 L60 82 L21 72 L60 62 Z" fill="url(#sea)"/>
    <path d="M72 42 L78 66 L103 72 L78 78 L72 102 L66 78 L41 72 L66 66 Z" fill="#FFFFFF"/>
    <circle cx="72" cy="72" r="14" fill="#0056D2"/>
  </g>

  <text x="300" y="175" fill="#64748B" font-family="Inter, Segoe UI, sans-serif" font-size="28" font-weight="800" letter-spacing="4">
    MARITIME LMS
  </text>
  <text x="300" y="245" fill="#0F172A" font-family="Inter, Segoe UI, sans-serif" font-size="72" font-weight="900">
    HoHoLiHu
  </text>
  <text x="300" y="305" fill="#334155" font-family="Inter, Segoe UI, sans-serif" font-size="30" font-weight="600">
    Production-first learning platform for maritime training
  </text>

  <g transform="translate(300 360)" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="700">
    <rect x="0" y="0" width="150" height="46" rx="23" fill="#0056D2"/>
    <text x="26" y="30" fill="#FFFFFF">Angular 20</text>
    <rect x="166" y="0" width="170" height="46" rx="23" fill="#E8F1FF" stroke="#CFE1F6"/>
    <text x="191" y="30" fill="#0056D2">Spring Boot</text>
    <rect x="352" y="0" width="116" height="46" rx="23" fill="#E8F1FF" stroke="#CFE1F6"/>
    <text x="381" y="30" fill="#0056D2">PWA</text>
    <rect x="484" y="0" width="176" height="46" rx="23" fill="#E8F1FF" stroke="#CFE1F6"/>
    <text x="512" y="30" fill="#0056D2">Adaptive Video</text>
  </g>

  <path d="M300 462 H980" stroke="#D8E4F2" stroke-width="2"/>
  <text x="300" y="505" fill="#475569" font-family="Inter, Segoe UI, sans-serif" font-size="24" font-weight="600">
    Clean Architecture · DDD · PostgreSQL · Cloudflare R2 · Docker Compose
  </text>
</svg>
